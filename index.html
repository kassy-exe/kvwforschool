<input id="url" placeholder="YouTubeのURLかID" style="width:70%">
<button onclick="load()">再生</button>

<div style="margin-top:12px">
  <iframe id="player" style="width:100%; aspect-ratio:16/9; border:0;"
    allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>

<script>
function load() {
  const v = document.getElementById('url').value.trim();
  const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || v.match(/^([\w-]{11})$/);
  if (!m) return alert('IDが拾えなかった');
  document.getElementById('player').src =
    'https://www.youtube-nocookie.com/embed/' + m[1];
}
document.getElementById('url').addEventListener('keydown', e => {
  if (e.key === 'Enter') load();
});
</script>
